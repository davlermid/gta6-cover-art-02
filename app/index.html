<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Neon Shore Cover Studio</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%23ff5e8a'/%3E%3C/svg%3E">
<link rel="stylesheet" href="./style.css">
</head>
<body>
<main class="app">
  <section class="controls" id="controls">
    <header class="brand">
      <h1>Neon Shore</h1>
      <p class="tagline">Cover Studio — turn your photos into poster art</p>
    </header>

    <fieldset class="group">
      <legend>Photos</legend>
      <label class="filebtn">Upload photos
        <input id="photoInput" type="file" accept="image/*" multiple>
      </label>
      <p class="hint">…or drop images onto the cover. Click a thumbnail to place it in the selected panel.</p>
      <div id="tray" class="tray"></div>
    </fieldset>

    <fieldset class="group">
      <legend>Lettering</legend>
      <label>Main title <input id="title" type="text" maxlength="32" value="Neon Shore"></label>
      <label>Subtitle <input id="subtitle" type="text" maxlength="48" value="welcome to the coast"></label>
      <label>Title fill
        <select id="titleFill">
          <option value="white">White + black outline</option>
          <option value="sunset">Sunset gradient</option>
        </select>
      </label>
      <label>Title size <input id="titleSize" type="range" min="0.6" max="1.5" step="0.05" value="1"></label>
      <label>Title position <input id="titlePos" type="range" min="0" max="1" step="0.05" value="0.5"></label>
      <label>Badge text <input id="ribbonText" type="text" maxlength="20" value="Fresh Drop"></label>
    </fieldset>

    <fieldset class="group">
      <legend>Style</legend>
      <label>Layout <select id="layout"></select></label>
      <label>Color grade <select id="grade"></select></label>
      <label>Panel border
        <select id="border">
          <option value="white">White frame</option>
          <option value="ink">Inked edges</option>
          <option value="none">None</option>
        </select>
      </label>
      <label>Panel gap <input id="gap" type="range" min="0" max="3" step="0.1" value="1"></label>
      <div class="toggles">
        <label><input id="toggleRibbon" type="checkbox" checked> Badge ribbon</label>
        <label><input id="toggleGrain" type="checkbox" checked> Film grain</label>
        <label><input id="toggleVignette" type="checkbox" checked> Vignette</label>
        <label><input id="toggleHalftone" type="checkbox" checked> Halftone title block</label>
      </div>
      <label>Heat meter
        <span id="starMeter" class="stars"></span>
        <input id="stars" type="range" min="0" max="5" step="1" value="3">
      </label>
    </fieldset>

    <fieldset class="group">
      <legend>Selected panel — <span id="selectedLabel">Panel 1</span></legend>
      <p class="hint">Photo: <span id="photoName">—</span></p>
      <label>Panel grade override
        <select id="panelGrade">
          <option value="">Cover grade</option>
        </select>
      </label>
      <label>Panel zoom <input id="panelZoom" type="range" min="1" max="4" step="0.05" value="1"></label>
    </fieldset>

    <fieldset class="group">
      <legend>Actions</legend>
      <div class="btnrow">
        <button id="undo" type="button">Undo</button>
        <button id="redo" type="button">Redo</button>
        <button id="randomize" type="button">Randomize</button>
        <button id="reset" type="button">Reset</button>
      </div>
      <label>Preview aspect
        <select id="size"></select>
      </label>
      <p class="export-hint">Export PNG</p>
      <div class="btnrow">
        <button id="export-square" type="button">1080×1080</button>
        <button id="export-portrait" type="button">1080×1350</button>
        <button id="export-wide" type="button">1920×1080</button>
        <button id="export-story" type="button">1080×1920</button>
      </div>
      <p id="status" role="status"></p>
    </fieldset>
  </section>

  <section class="stage" id="canvasWrap">
    <div class="canvas-frame">
      <canvas id="cover" width="1080" height="1080" aria-label="The cover preview"></canvas>
      <div id="panels" class="panels"></div>
    </div>
  </section>
</main>
<script type="module" src="./src/main.js"></script>
</body>
</html>
